[project]
name = "arc-hybrid-search"
version = "0.1.0"
description = "Hybrid (dense + BM25) search over the ISARIC ARC reference catalog, with raw and list/option-expanded variants."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_hybrid_search"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
